<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Plague IT: a threat-map strategy game where you play the malware.">
  <title>Plague IT</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">PLAGUE<span>IT</span></div>
    <div id="clock">Day 1 · 00:00</div>
    <div id="speed" role="group" aria-label="Game speed">
      <button id="pause" type="button" aria-label="Pause" title="Pause (Space)">❚❚</button>
      <button type="button" data-speed="1" title="Normal speed (1)">1×</button>
      <button type="button" data-speed="2" title="Fast (2)">2×</button>
      <button type="button" data-speed="3" title="Fastest (3)">3×</button>
    </div>
    <div id="points" title="Exploit Points"><span class="hex">⬢</span> <span id="points-value">0</span></div>
  </header>
  <div id="ticker" hidden aria-live="off"><div class="track"></div></div>

  <main id="stage">
    <canvas id="map" aria-label="Threat map"></canvas>
    <div id="banner" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <ul id="defenses" hidden aria-label="SecOps defenses in force"></ul>
    <aside id="site-panel" hidden></aside>
  </main>

  <footer id="bottombar">
    <div class="stats">
      <div class="stat" id="stat-spread"><span class="name">Spread</span><i><b class="fill"></b></i><span class="value">0</span></div>
      <div class="stat" id="stat-noise"><span class="name">Noise</span><i><b class="fill"></b></i><span class="value">0</span></div>
      <div class="stat" id="stat-impact"><span class="name">Impact</span><i><b class="fill"></b></i><span class="value">0</span></div>
    </div>
    <div class="totals">
      <div id="totals-bar"><b class="infected"></b><b class="remediated"></b></div>
      <div class="legend">
        <span><i class="dot healthy"></i><span id="tot-healthy">0</span> healthy</span>
        <span><i class="dot infected"></i><span id="tot-infected">0</span> infected</span>
        <span><i class="dot remediated"></i><span id="tot-remediated">0</span> remediated</span>
      </div>
      <div id="remediation" hidden>
        <span class="name">Remediation</span><i><b class="fill"></b></i><span class="value">0%</span>
      </div>
    </div>
    <button id="evolve" type="button" disabled title="Evolution (E)">Evolve <span class="hex">⬢</span> <span id="evolve-points">0</span></button>
  </footer>

  <div id="evolution" hidden></div>
  <div id="overlay" hidden></div>
  <div id="boot">Loading…</div>
  <script>
    // Shows load errors on the page instead of a blank screen (main.js removes #boot once running).
    addEventListener('error', (e) => {
      const b = document.getElementById('boot');
      if (b) b.textContent = 'The game failed to load: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown error');
    }, true);
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
